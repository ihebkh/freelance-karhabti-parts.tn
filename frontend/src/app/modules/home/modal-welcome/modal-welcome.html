<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <button class="modal-close" (click)="close()" aria-label="Fermer">&#x2715;</button>

    <h2 class="modal-title" id="modal-title">Choisissez votre catégorie</h2>

    <div class="modal-grid">

        <a class="cat-card" href="#">
            <span class="cat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                </svg>
            </span>
            <div class="cat-name">Accessoires</div>
            <div class="cat-desc">Accessoires automobile</div>
        </a>

        <a class="cat-card" href="#">
            <span class="cat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="1" y="3" width="15" height="13" rx="2" />
                    <path d="M16 8h4l3 3v5h-7V8z" />
                    <circle cx="5.5" cy="18.5" r="2.5" />
                    <circle cx="18.5" cy="18.5" r="2.5" />
                </svg>
            </span>
            <div class="cat-name">Parts</div>
            <div class="cat-desc">Pièces détachées</div>
        </a>

        <a class="cat-card" href="#">
            <span class="cat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </span>
            <div class="cat-name">Pneu</div>
            <div class="cat-desc">Pneumatiques</div>
        </a>

        <a class="cat-card" href="#">
            <span class="cat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" />
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
                    <line x1="12" y1="12" x2="12" y2="16" />
                    <line x1="10" y1="14" x2="14" y2="14" />
                </svg>
            </span>
            <div class="cat-name">B2B</div>
            <div class="cat-desc">Espace professionnel</div>
        </a>

    </div>

    <div class="modal-footer">
        <button class="btn-close" (click)="close()">Fermer</button>
    </div>

</div>
