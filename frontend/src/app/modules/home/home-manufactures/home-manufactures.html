<div class="manufacturers-section">
  <div class="logo-grid-container">
    <div class="logo-grid-wrapper">
      <div class="logo-grid-track">

        <!-- Première rangée (défilement normal) -->
        <div class="logo-grid-row">
          <!-- Groupe 1 - Première moitié des logos -->
          <div class="logo-row-group">
            <div class="manufacturer-card"
                 *ngFor="let item of getFirstHalfLogos()">
              <div class="logo-container">
                <img
                  [src]="item.fullUrl || 'assets/images/placeholder-logo.png'"
                  [alt]="item.item.name"
                  class="manufacturer-logo"
                  draggable="false"
                />
              </div>
            </div>
          </div>
