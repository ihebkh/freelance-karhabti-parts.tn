<div class="auth-split-container">
  <!-- LEFT SIDE: FORM -->
  <div class="auth-form-side">
    <div class="auth-form-content">
      <h2>Ravi de vous revoir 👋</h2>
      <p class="subtitle">Connectez-vous afin de profiter de notre service de pièces de rechange.</p>

      <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>
        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            #emailCtrl="ngModel"
            placeholder="exemple@email.com"
            required
            email
          />
          <small class="error"
                 *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)">
            <span *ngIf="emailCtrl.errors?.['required']">L'e-mail est obligatoire</span>
            <span *ngIf="emailCtrl.errors?.['email']">Format d'e-mail invalide</span>
          </small>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            #passwordCtrl="ngModel"
            placeholder="Au moins 8 caractères"
            required
            minlength="8"
          />
          <small class="error"
                 *ngIf="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched)">
            <span *ngIf="passwordCtrl.errors?.['required']">Le mot de passe est obligatoire</span>
            <span *ngIf="passwordCtrl.errors?.['minlength']">Minimum 8 caractères</span>
          </small>
        </div>

        <div class="forgot-password">
          <a routerLink="/auth/forgot-password">Mot de passe oublié ?</a>
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">
          Se connecter
        </button>
      </form>

      <div class="divider">
        <span>Ou</span>
      </div>


      <p *ngIf="message" class="success-msg">{{ message }}</p>
      <p *ngIf="error" class="error-msg">{{ error }}</p>

      <p class="switch">
        Vous n'avez pas de compte ? <a routerLink="/auth/signup">S'inscrire</a>
      </p>
    </div>
  </div>

  <!-- RIGHT SIDE: IMAGE -->
  <div class="auth-image-side">
    <div class="image-overlay"></div>
  </div>
</div>
