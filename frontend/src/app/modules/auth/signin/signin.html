<div class="auth-split-container">
  <!-- LEFT SIDE: FORM -->
  <div class="auth-form-side">
    <div class="auth-form-content">
      <h2>Ravi de vous revoir 👋</h2>
      <p class="subtitle">Connectez-vous afin de profiter de notre service de pièces de rechange.</p>

      <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" novalidate>

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            #emailCtrl="ngModel"
            placeholder="exemple@email.com"
            required
            email
          />
          <small class="error"
                 *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)">
            <span *ngIf="emailCtrl.errors?.['required']">L'e-mail est obligatoire</span>
            <span *ngIf="emailCtrl.errors?.['email']">Format d'e-mail invalide</span>
          </small>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              #passwordCtrl="ngModel"
              placeholder="Au moins 8 caractères"
              required
              minlength="8"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <!-- EYE OPEN (password visible) -->
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5
                         12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0
                         0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0
                         1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894
                         7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242
                         4.242L9.88 9.88"/>
              </svg>
              <!-- EYE CLOSED (password hidden) -->
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12
                         4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577
                         16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
              </svg>
            </button>
          </div>
          <small class="error"
                 *ngIf="passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched)">
            <span *ngIf="passwordCtrl.errors?.['required']">Le mot de passe est obligatoire</span>
            <span *ngIf="passwordCtrl.errors?.['minlength']">Minimum 8 caractères</span>
          </small>
        </div>

        <div class="forgot-password">
          <a routerLink="/auth/forgot-password">Mot de passe oublié ?</a>
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">
          Se connecter
        </button>

      </form>

      <div class="divider">
        <span>Ou</span>
      </div>

      <p *ngIf="message" class="success-msg">{{ message }}</p>
      <p *ngIf="error" class="error-msg">{{ error }}</p>

      <p class="switch">
        Vous n'avez pas de compte ? <a routerLink="/auth/signup">S'inscrire</a>
      </p>
    </div>
  </div>

  <!-- RIGHT SIDE: IMAGE -->
  <div class="auth-image-side">
    <div class="image-overlay"></div>
  </div>
</div>
