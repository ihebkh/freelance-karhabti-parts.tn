<div class="page-wrapper">


  <div class="brand-container">
    <div class="brand-card" *ngFor="let item of subCategories">
      <div (click)="toSubCategory(item.sub.id)">
        <div class="brand-logo-area">
          <div class="logo-cadre">
            <img *ngIf="item.fullImageUrl; else noImage" [src]="item.fullImageUrl" [alt]="item.sub.name">
            <ng-template #noImage><div class="logo-placeholder">🗂️</div></ng-template>
          </div>
          <h4>{{ item.sub.name }}</h4>
        </div>
      </div>

      <div class="brand-actions">
        <div class="admin-controls">
          <button *ngIf="authService.isAdmin()" class="btn-edit" (click)="openModal(content, item.sub)" title="Modifier">✏️</button>
          <button *ngIf="authService.isAdmin()" class="btn-delete" (click)="deleteSubCategory(item.sub.id)" title="Supprimer">🗑️</button>
        </div>
      </div>
    </div>

    <div *ngIf="authService.isAdmin()" class="brand-card add-brand-card" (click)="openModal(content)">
      <div class="add-icon-wrapper"><span>+</span></div>
      <h4>Ajouter une sous-catégorie</h4>
    </div>
  </div>

  <ng-template #content let-modal>
    <div class="garage-modal friendly-modal">
      <div class="modal-header-clean">
        <div class="header-content">
          <span class="category-tag">{{ editingSubCategoryId ? 'Profil de la sous-catégorie' : 'Nouvelle sous-catégorie' }}</span>
          <h5 class="modal-title">{{ editingSubCategoryId ? 'Modifier la sous-catégorie' : 'Créer une sous-catégorie' }}</h5>
        </div>
        <button type="button" class="btn-close-circle" (click)="modal.dismiss()">✕</button>
      </div>

      <div class="modal-body-friendly">
        <form [formGroup]="form" (ngSubmit)="submit()" class="modern-form">
          <div class="form-group">
            <label class="friendly-label">Nom de la sous-catégorie</label>
            <input formControlName="name" type="text" class="friendly-input" placeholder="Nom de la sous-catégorie" />
          </div>

          <div class="form-group">
            <label class="friendly-label">Image de la sous-catégorie</label>
            <input type="file" (change)="onFileChange($event)" class="hidden-file" id="subCategoryImage" />
            <label for="subCategoryImage" class="file-dropzone">
              <div class="dropzone-content">
                <span class="upload-icon">📁</span>
                <span>{{ form.get('image')?.value ? 'Image jointe !' : 'Cliquez pour sélectionner une image' }}</span>
              </div>
            </label>
          </div>

          <div class="modal-footer-friendly">
            <button type="button" class="btn-ghost" (click)="modal.dismiss()">Annuler</button>
            <button type="submit" class="btn-action-primary">{{ editingSubCategoryId ? 'Mettre à jour' : 'Enregistrer' }}</button>
          </div>
        </form>
      </div>
    </div>
  </ng-template>
</div>
