<app-car-header title="Marques"
  subtitle="Sélectionnez une marque pour explorer les modèles disponibles"></app-car-header>
<div class="page-wrapper">

  <div class="brand-container">



    <div class="brand-card" *ngFor="let item of brandsWithUrl">

      <div class="brand-logo-area" (click)="viewModels(item.brand.id)">
        <div class="logo-cadre">
          <img *ngIf="item.fullLogoUrl; else noLogo" [src]="item.fullLogoUrl" [alt]="item.brand.name" />
          <ng-template #noLogo>
            <div class="logo-placeholder">🏎️</div>
          </ng-template>
        </div>
        <h4>{{ item.brand.name }}</h4>
      </div>



      <div class="brand-actions">
        <div class="admin-controls" *ngIf="authService.isAdmin()">
          <button class="btn-edit" (click)="openModal(content, item.brand)" title="Modifier">✏️</button>
          <button class="bi bi-trash" (click)="deleteBrand(item.brand.id)" title="Supprimer">🗑️</button>
        </div>
      </div>
    </div>

    <div *ngIf="authService.isAdmin()" class="brand-card add-brand-card" (click)="openModal(content)">
      <div class="add-icon-wrapper">
        <span>+</span>
      </div>
      <h4>Ajouter un constructeur</h4>
    </div>
  </div>



  <ng-template #content let-modal>
    <div class="friendly-modal">
      <div class="modal-header-clean">
        <div class="header-content">
          <span class="category-tag">{{ editingBrandId ? 'Profil du constructeur' : 'Enregistrement de marque' }}</span>
          <h5 class="modal-title">{{ editingBrandId ? 'Modifier la marque' : 'Enregistrer une nouvelle marque' }}</h5>
        </div>
        <button type="button" class="btn-close-circle" (click)="modal.dismiss()">✕</button>
      </div>

      <div class="modal-body-friendly">
        <form [formGroup]="form" (ngSubmit)="submit()" class="modern-form">

          <div class="form-group">
            <label class="friendly-label">Nom de la marque</label>
            <input formControlName="name" type="text" class="friendly-input"
              placeholder="ex: Porsche, BMW, ou Toyota" />
          </div>

          <div class="form-group">
            <label class="friendly-label">Logo du constructeur</label>
            <div class="custom-file-upload">
              <input type="file" (change)="onFileChange($event)" id="brandLogo" class="hidden-file" />
              <label for="brandLogo" class="file-dropzone">
                <div class="dropzone-content">
                  <span class="upload-icon">🏷️</span>
                  <span>{{ form.get('image')?.value ? 'Logo joint !' : 'Cliquez pour sélectionner le logo de la marque'
                    }}</span>
                </div>
              </label>
            </div>
          </div>

          <div class="modal-footer-friendly">
            <button type="button" class="btn-ghost" (click)="modal.dismiss()">Annuler</button>
            <button type="submit" class="btn-action-primary">
              {{ editingBrandId ? 'Mettre à jour la marque' : 'Enregistrer la marque' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </ng-template>

</div>
