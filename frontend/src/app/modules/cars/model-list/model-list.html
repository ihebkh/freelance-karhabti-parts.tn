<app-car-header title="Modèles"
  subtitle="Sélectionnez une modèle pour explorer les générations disponibles"></app-car-header>
<div class="page-wrapper">
  <div class="model-container">
    <div class="model-card" *ngFor="let m of modelsWithUrl">
      <div class="model-logo-area" (click)="viewGenerations(m.model.id)">
        <div class="model-cadre">
          <img *ngIf="m.fullLogoUrl; else noImg" [src]="m.fullLogoUrl" [alt]="m.model.name" />
          <ng-template #noImg>
            <div class="logo-placeholder">🚗</div>
          </ng-template>
        </div>
        <h4>{{ m.model.name }}</h4>
      </div>

      <div class="model-actions">
        <div class="admin-controls" *ngIf="authService.isAdmin()">
          <button class="btn-edit" (click)="openModal(content, m.model)" title="Modifier">✏️</button>
          <button class="btn-delete" (click)="deleteModel(m.model.id)" title="Supprimer">🗑️</button>
        </div>
      </div>
    </div>

    <div *ngIf="authService.isAdmin()" class="model-card add-model-card" (click)="openModal(content)">
      <div class="add-icon-wrapper">
        <span>+</span>
      </div>
      <h4>Nouveau modèle</h4>
    </div>
  </div>

  <ng-template #content let-modal>
    <div class="garage-modal friendly-modal">

      <div class="modal-header-clean">
        <div class="header-content">
          <span class="category-tag">{{ editingModelId ? 'Affiner le catalogue' : 'Nouvelle série' }}</span>
          <h5 class="modal-title">{{ editingModelId ? 'Modifier le modèle' : 'Enregistrer le modèle' }}</h5>
        </div>
        <button type="button" class="btn-close-circle" (click)="modal.dismiss()">✕</button>
      </div>

      <div class="modal-body-friendly">
        <form [formGroup]="form" (ngSubmit)="submit()" class="modern-form">

          <div class="form-group">
            <label class="friendly-label">Nom du modèle</label>
            <input formControlName="name" type="text" class="friendly-input" placeholder="ex: Golf GTI" />
          </div>

          <div class="form-group">
            <label class="friendly-label">Image du modèle</label>
            <div class="custom-file-upload">
              <input type="file" (change)="onFileChange($event)" id="modelImg" class="hidden-file" />
              <label for="modelImg" class="file-dropzone">
                <div class="dropzone-content">
                  <span class="upload-icon">🏎️</span>
                  <span>Télécharger l'image du véhicule...</span>
                </div>
              </label>
            </div>
          </div>

          <div class="modal-footer-friendly">
            <button type="button" class="btn-ghost" (click)="modal.dismiss()">Annuler</button>
            <button type="submit" class="btn-action-primary">
              {{ editingModelId ? 'Mettre à jour' : 'Enregistrer le modèle' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </ng-template>
</div>
